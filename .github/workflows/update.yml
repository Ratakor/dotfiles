name: Update sources

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    - cron: "0 1 * * 6" # At 01:00 on Saturday.

permissions:
  contents: read
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: nixos
          token: "${{ secrets.FLAKE_UPDATE_PAT }}"

      - name: "Set up Nix"
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators

      - name: "Set up Cachix"
        uses: cachix/cachix-action@v17
        with:
          name: ratakor

      - name: "Update sources"
        run: nix run .#tack -- update > body.txt 2>&1

      - uses: peter-evans/create-pull-request@v8
        with:
          branch: nixos/update-sources
          commit-message: "ci: update sources"
          title: "ci: update sources"
          body-path: body.txt
