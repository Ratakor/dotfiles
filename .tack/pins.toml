# tack pins
# edit by hand or with tack add / rm / alias
# nix reads pins.lock.json
# this file drives tack update

# shorturl schemes
# `scheme:rest` expands by substituting `rest` into the template `{path}`
[shorturls]
codeberg = "git+https://codeberg.org/{path}"
channel = "https://channels.nixos.org/{path}/nixexprs.tar.zst"

[tack]
recomposable = true

# all_follow maps input names to the top-level pin they follow
# opt out per-input with exclude_follow
[all_follow]
nixpkgs = "nixpkgs"

# inputs.<name> fields
#   url             required, shorturl ok, ?rev=<sha> pins an exact commit
#   type            flake (default), fetch, or fixed
#   flake           legacy false means type = "fetch"
#   follows         { child = "pin" } override map
#   exclude_follow  all_follow names to skip
#   dir             subdir holding flake.nix
#   submodules      fetch git submodules
#   unpack          fixed-only tarball or file

# age-encrypted secrets for NixOS and Home manager
[inputs.agenix]
url = "github:ryantm/agenix"
type = "fetch"

# Watch anime in cli with Anilist, MAL Integration and Discord RPC
[inputs.curd]
url = "github:Wraient/curd"
type = "fetch"

# Declarative disk partitioning and formatting using nix
[inputs.disko]
url = "github:nix-community/disko"

# Official and Third Party Plugins & Themes for DankMaterialShell
[inputs.dms-plugin-registry]
url = "github:AvengeMedia/dms-plugin-registry"

# Dove is a suite of configurations & advanced modifications for Mozilla
# Thunderbird, designed to put the user first - with a focus on privacy,
# security, freedom, & usability.
[inputs.dove]
url = "codeberg:celenity/Dove?ref=pages"
follows = { phoenix = "phoenix" }

# Nix flake for the Helium browser
[inputs.helium]
url = "github:amaanq/helium-flake"

# Manage a user environment using Nix
[inputs.home-manager]
url = "github:nix-community/home-manager"

# Secure Boot & Measured Boot for NixOS
[inputs.lanzaboote]
url = "github:nix-community/lanzaboote"
follows = { pre-commit = "" }
# crane
# rust-overlay

# Any version of any nixpkgs package, from one flake input
[inputs.multiverse]
url = "github:fzakaria/nixpkgs-multiverse"

# Not a Docs Generator
[inputs.ndg]
url = "github:feel-co/ndg"
type = "fetch"

# A scrollable-tiling Wayland compositor
[inputs.niri]
url = "github:niri-wm/niri"

# Scripts for additional functionality when using niri
[inputs.niri_tweaks]
url = "github:heyoeyo/niri_tweaks"
type = "fetch"

# Run unpatched binaries on Nix/NixOS
[inputs.nix-alien]
url = "github:thiagokokada/nix-alien"
follows = { flake-compat = "", nix-index-database = "nix-index-database" }

# Weekly updated nix-index database
# Used standalone and dependency of nix-alien
[inputs.nix-index-database]
url = "github:nix-community/nix-index-database"

# Library for using modules to wrap packages with configuration directly,
# and a collection of pre-built wrapper modules!
[inputs.nix-wrapper-modules]
url = "github:BirdeeHub/nix-wrapper-modules"
type = "fetch"

# Core NixOS utilities in safe, portable Rust for NixOS and friends
[inputs.nixos-core]
url = "github:manic-systems/nixos-core"

# A collection of NixOS modules covering hardware quirks
[inputs.nixos-hardware]
url = "github:NixOS/nixos-hardware"
type = "fetch"

# Nix Packages collection & NixOS
# https://wiki.nixos.org/wiki/Channel_branches
[inputs.nixpkgs]
url = "channel:nixos-unstable"

# A sleek and minimal desktop shell thoughtfully crafted for Wayland
[inputs.noctalia]
url = "github:noctalia-dev/noctalia"

[inputs.noctalia-greeter]
url = "github:noctalia-dev/noctalia-greeter"

# Network Printer, or; "No Problem" (We still have Many Problems)
[inputs.np]
url = "github:notashelf/np"
type = "fetch"

# Phoenix is a suite of configurations & advanced modifications for Mozilla
# Firefox, designed to put the user first - with a focus on privacy, security,
# freedom, & usability.
# Dependency of Dove
[inputs.phoenix]
url = "codeberg:celenity/Phoenix?ref=pages"
type = "fetch"

# Nix module to customize spotify client via spicetify
[inputs.spicetify]
url = "github:Gerg-L/spicetify-nix"
type = "fetch"

# flake-like toml nix pins, lazily fetched and transformed
[inputs.tack]
url = "github:manic-systems/tack"

# Formatter multiplexer, configured in nix
[inputs.treefmt-nix]
url = "github:numtide/treefmt-nix"

# CLI tool to restore files from ZFS snapshots
[inputs.zfs-restore]
url = "github:ratakor/zfs-restore"
type = "fetch"
